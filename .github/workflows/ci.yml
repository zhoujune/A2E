name: A2E checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-and-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust format
        run: python3 artifact/check-rust-format.py
      - name: Rust tests
        run: cargo test --manifest-path reference-broker/Cargo.toml --all-targets
      - name: Validate retained reports
        shell: bash
        run: |
          python3 artifact/validate_report.py artifact/results/linux-smoke-preflight.json
          python3 reference-broker/evaluation/validate_report.py reference-broker/evaluation/results/rq1-rq2-linux.json
          python3 reference-broker/evaluation/validate_repeated_rq2.py reference-broker/evaluation/results/rq2-repeated-linux.json
          python3 reference-broker/evaluation/validate_repeated_rq2.py reference-broker/evaluation/results/rq2-repeated-server-overlayfs.json
          python3 reference-broker/evaluation/validate_repeated_rq2.py reference-broker/evaluation/results/rq2-repeated-server-tmpfs.json
          python3 reference-broker/evaluation/validate_repeated_rq2.py reference-broker/evaluation/results/rq2-repeated-server-ext4.json
          python3 reference-broker/evaluation/validate_repeated_rq2.py reference-broker/evaluation/results/rq2-repeated-wsl2-ext4.json
          python3 reference-broker/evaluation/validate_rq3.py reference-broker/evaluation/results/rq3-proof-effort.json
          python3 reference-broker/evaluation/validate_rq4.py reference-broker/evaluation/rq4-fault-matrix.v1.json
          python3 reference-broker/evaluation/validate_k4_i1.py reference-broker/evaluation/results/k4-i1-submission.json
          python3 formal/validate_traceability.py formal/theorem-premise-traceability.v1.json
          python3 reference-broker/evaluation/validate_redis_evidence.py
      - name: TLA+ smoke packaging preflight
        run: ./reproduce.sh smoke --dry-run --skip-verus --output-directory "$RUNNER_TEMP/a2e-smoke"
      - name: Anonymous release scan
        run: python3 artifact/check-release.py
      - name: Build anonymous release archive
        shell: bash
        run: |
          read -r revision manifest < <(python3 -c 'import json; p=json.load(open("reference-broker/evaluation/results/k4-i1-submission.json"))["provenance"]; print(p["source_revision"], p["source_manifest_sha256"])')
          python3 artifact/create-release.py \
            --verified-source-revision "$revision" \
            --verified-source-manifest-sha256 "$manifest" \
            --output "$RUNNER_TEMP/a2e-fse-artifact.tar.gz"
