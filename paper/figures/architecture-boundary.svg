<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">Architecture and evidence boundaries</title>
  <desc id="desc">The tested Rust reference broker runs between an agent, byte WAL, adapter, and protected service. Every record on the gated broker path is previewed by a verified executable K4-A4 kernel before its durable WAL append and committed to the kernel afterward; reopening replays the complete WAL through the same gate. The kernel is proved against part of a larger machine-checked semantic model, while deployment components are not covered by whole-program refinement.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .heading { font: 700 15px Arial, Helvetica, sans-serif; fill: #172033; }
      .label { font: 600 18px Arial, Helvetica, sans-serif; fill: #172033; }
      .body { font: 15px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #526174; }
      .box { fill: #ffffff; stroke: #526174; stroke-width: 1.5; rx: 5; }
      .flow { fill: none; stroke: #334155; stroke-width: 1.8; marker-end: url(#arrow); }
      .check { fill: none; stroke: #25627a; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="25" y="25" width="1350" height="330" rx="7" fill="#fafafa" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="45" y="53" class="heading">TRUSTED / UNVERIFIED DEPLOYMENT BOUNDARY</text>
  <text x="1355" y="53" class="small" text-anchor="end">fail-stop environment; one writer and one executor slot</text>

  <rect x="55" y="105" width="155" height="105" class="box"/>
  <text x="132" y="145" class="label" text-anchor="middle">Agent</text>
  <text x="132" y="174" class="small" text-anchor="middle">chooses tool call</text>
  <text x="132" y="194" class="small" text-anchor="middle">consumes result</text>

  <path d="M210 157 H277" class="flow"/>
  <text x="244" y="143" class="small" text-anchor="middle">request</text>

  <rect x="280" y="82" width="300" height="150" rx="5" fill="#fff6e8" stroke="#8a6b35" stroke-width="1.7"/>
  <text x="430" y="119" class="label" text-anchor="middle">Rust reference broker</text>
  <text x="430" y="148" class="body" text-anchor="middle">admission, recovery, retry</text>
  <text x="430" y="173" class="body" text-anchor="middle">terminal retrieval + AppendGate</text>
  <rect x="355" y="190" width="150" height="26" rx="3" fill="#f5e5c6" stroke="#8a6b35" stroke-width="1"/>
  <text x="430" y="208" class="small" text-anchor="middle" font-weight="700">TESTED REFERENCE CODE</text>

  <path d="M430 232 V273" class="flow"/>
  <text x="447" y="251" class="small">after preview:</text>
  <text x="447" y="269" class="small">append + fsync</text>
  <rect x="280" y="276" width="300" height="55" class="box" fill="#fffdf8"/>
  <text x="430" y="299" class="label" text-anchor="middle">Byte WAL + fsync</text>
  <text x="430" y="320" class="small" text-anchor="middle">encoding, CRC, filesystem unrefined</text>

  <path d="M580 157 H712" class="flow"/>
  <text x="646" y="143" class="small" text-anchor="middle">physical attempts</text>

  <rect x="715" y="105" width="220" height="105" class="box" fill="#fffdf8"/>
  <text x="825" y="145" class="label" text-anchor="middle">Tool adapter</text>
  <text x="825" y="174" class="small" text-anchor="middle">effect contract</text>
  <text x="825" y="194" class="small" text-anchor="middle">and transport</text>

  <path d="M935 157 H1067" class="flow"/>
  <text x="1001" y="143" class="small" text-anchor="middle">call / result</text>

  <rect x="1070" y="105" width="260" height="105" class="box" fill="#fffdf8"/>
  <text x="1200" y="145" class="label" text-anchor="middle">Protected service</text>
  <text x="1200" y="174" class="small" text-anchor="middle">owns external effect</text>
  <text x="1200" y="194" class="small" text-anchor="middle">deployment code unverified</text>

  <text x="1015" y="302" class="small">Outside whole-program refinement:</text>
  <text x="1015" y="323" class="small">Rust control flow, adapters, transport,</text>
  <text x="1015" y="342" class="small">filesystem, and protected service</text>

  <rect x="120" y="405" width="560" height="190" rx="7" fill="#eef6fa" stroke="#25627a" stroke-width="1.7"/>
  <text x="140" y="434" class="heading">VERIFIED EXECUTABLE BOUNDARY</text>
  <rect x="155" y="463" width="490" height="98" rx="5" fill="#ffffff" stroke="#25627a" stroke-width="1.5"/>
  <text x="400" y="496" class="label" text-anchor="middle">Proof-erased K4-A4 record/recovery kernel</text>
  <text x="400" y="524" class="body" text-anchor="middle">arbitrary legal sequences of eight supported records</text>
  <text x="400" y="548" class="small" text-anchor="middle">guards, mutations, LSN/cuts, terminal evidence, recovery control</text>

  <path d="M430 331 V341" class="check"/>
  <rect x="110" y="344" width="570" height="48" rx="4" fill="#ffffff" stroke="#25627a" stroke-width="1.2"/>
  <text x="395" y="364" class="small" text-anchor="middle" font-weight="700">K4-I0 IN-LOOP APPEND / REPLAY GATE</text>
  <text x="395" y="383" class="small" text-anchor="middle">every record: preview -&gt; durable WAL -&gt; commit; reopen: full-WAL replay</text>
  <path d="M395 392 V460" class="check"/>

  <rect x="705" y="405" width="670" height="335" rx="7" fill="#eef5ef" stroke="#3f7450" stroke-width="1.7"/>
  <text x="725" y="434" class="heading">MACHINE-CHECKED SEMANTIC BOUNDARY</text>

  <rect x="740" y="466" width="285" height="105" rx="5" fill="#ffffff" stroke="#3f7450" stroke-width="1.4"/>
  <text x="882" y="499" class="label" text-anchor="middle">Broker model</text>
  <text x="882" y="526" class="body" text-anchor="middle">logical requests, attempts,</text>
  <text x="882" y="549" class="body" text-anchor="middle">deliveries, terminal outcomes</text>

  <rect x="1055" y="466" width="285" height="105" rx="5" fill="#ffffff" stroke="#3f7450" stroke-width="1.4"/>
  <text x="1197" y="499" class="label" text-anchor="middle">Journal + typed WAL</text>
  <text x="1197" y="526" class="body" text-anchor="middle">persistence refinement</text>
  <text x="1197" y="549" class="body" text-anchor="middle">and recovery history</text>

  <path d="M1055 518 H1028" class="flow"/>
  <text x="1040" y="500" class="small" text-anchor="middle">refines</text>

  <rect x="740" y="610" width="285" height="92" rx="5" fill="#ffffff" stroke="#3f7450" stroke-width="1.4"/>
  <text x="882" y="642" class="label" text-anchor="middle">Adapter execution</text>
  <text x="882" y="671" class="small" text-anchor="middle">class-relative recovery semantics</text>
  <text x="882" y="691" class="small" text-anchor="middle">ReadOnly stops at this boundary</text>

  <rect x="1055" y="610" width="285" height="92" rx="5" fill="#ffffff" stroke="#3f7450" stroke-width="1.4"/>
  <text x="1197" y="642" class="label" text-anchor="middle">Protected-service model</text>
  <text x="1197" y="671" class="small" text-anchor="middle">effect state and mediation</text>
  <text x="1197" y="691" class="small" text-anchor="middle">covered Idempotent / Deduplicated</text>

  <path d="M1025 656 H1052" class="flow"/>
  <text x="1040" y="594" class="small" text-anchor="middle">coverage + closed interface</text>

  <path d="M680 516 H737" class="check"/>
  <rect x="655" y="470" width="85" height="43" rx="3" fill="#ffffff"/>
  <text x="697" y="487" class="small" text-anchor="middle">proved against</text>
  <text x="697" y="504" class="small" text-anchor="middle">record model</text>

  <rect x="120" y="612" width="560" height="100" rx="5" fill="#fff8ed" stroke="#8a6b35" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="400" y="640" class="body" text-anchor="middle" font-weight="700">The gate checks typed-record conformance, not whole-Rust refinement.</text>
  <text x="400" y="665" class="small" text-anchor="middle">Outside K4-A4: Revoke, byte WAL/decoding, filesystem/fsync,</text>
  <text x="400" y="687" class="small" text-anchor="middle">adapter/transport/service code, and broker control flow beyond the gate.</text>

  <line x1="45" y1="766" x2="1355" y2="766" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="48" y="749" width="18" height="12" fill="#eef5ef" stroke="#3f7450"/>
  <text x="75" y="760" class="small">machine checked</text>
  <rect x="205" y="749" width="18" height="12" fill="#eef6fa" stroke="#25627a"/>
  <text x="232" y="760" class="small">verified executable</text>
  <rect x="386" y="749" width="18" height="12" fill="#fff6e8" stroke="#8a6b35"/>
  <text x="413" y="760" class="small">tested reference code</text>
  <rect x="590" y="749" width="18" height="12" fill="#fafafa" stroke="#7b8794" stroke-dasharray="3 2"/>
  <text x="617" y="760" class="small">trusted / unverified deployment</text>
</svg>
