<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Authorized tool effect with a lost reply and class-specific recovery</title>
  <desc id="desc">An authorized append is durably started, reaches the protected service, and may linearize before its reply is lost. Recovery then depends on the declared tool-effect contract.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .label { font: 600 18px Arial, Helvetica, sans-serif; fill: #172033; }
      .body { font: 15px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #526174; }
      .step { stroke: #526174; stroke-width: 1.5; rx: 5; }
      .flow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #526174; stroke-width: 1.7; }
      .card { fill: #ffffff; stroke: #526174; stroke-width: 1.5; rx: 6; }
    </style>
  </defs>

  <text x="35" y="35" class="small" font-weight="700">ONE AUTHORIZED LOGICAL REQUEST</text>
  <line x1="35" y1="50" x2="1275" y2="50" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="35" y="85" width="170" height="125" class="step" fill="#edf4f8"/>
  <text x="120" y="120" class="label" text-anchor="middle">Authorize</text>
  <text x="120" y="146" class="body" text-anchor="middle">persist authority</text>
  <text x="120" y="171" class="small" text-anchor="middle">scope and budget</text>
  <text x="120" y="192" class="small" text-anchor="middle">become durable</text>

  <path d="M205 147 H242" class="flow"/>

  <rect x="245" y="85" width="170" height="125" class="step" fill="#edf4f8"/>
  <text x="330" y="120" class="label" text-anchor="middle">Start</text>
  <text x="330" y="146" class="body" text-anchor="middle">persist attempt</text>
  <text x="330" y="171" class="small" text-anchor="middle">attempt id and</text>
  <text x="330" y="192" class="small" text-anchor="middle">stable key</text>

  <path d="M415 147 H452" class="flow"/>

  <rect x="455" y="85" width="170" height="125" class="step" fill="#ffffff"/>
  <text x="540" y="120" class="label" text-anchor="middle">Invoke</text>
  <text x="540" y="146" class="body" text-anchor="middle">send physical</text>
  <text x="540" y="171" class="body" text-anchor="middle">attempt</text>
  <text x="540" y="192" class="small" text-anchor="middle">append(entry)</text>

  <path d="M625 147 H662" class="flow"/>

  <rect x="665" y="85" width="190" height="125" class="step" fill="#edf6ef"/>
  <text x="760" y="120" class="label" text-anchor="middle">Service linearizes</text>
  <text x="760" y="146" class="body" text-anchor="middle">entry may now be</text>
  <text x="760" y="171" class="body" text-anchor="middle">externally visible</text>
  <text x="760" y="192" class="small" text-anchor="middle">protected effect</text>

  <path d="M855 147 H892" class="flow"/>

  <rect x="895" y="85" width="170" height="125" class="step" fill="#fff4e8"/>
  <text x="980" y="120" class="label" text-anchor="middle">Reply is lost</text>
  <text x="980" y="146" class="body" text-anchor="middle">no durable</text>
  <text x="980" y="171" class="body" text-anchor="middle">Outcome record</text>
  <text x="980" y="192" class="small" text-anchor="middle">effect is ambiguous</text>

  <path d="M1065 147 H1102" class="flow"/>

  <rect x="1105" y="85" width="170" height="125" class="step" fill="#f8eded"/>
  <text x="1190" y="120" class="label" text-anchor="middle">Crash / recover</text>
  <text x="1190" y="146" class="body" text-anchor="middle">replay finds an</text>
  <text x="1190" y="171" class="body" text-anchor="middle">unmatched Start</text>
  <text x="1190" y="192" class="small" text-anchor="middle">no justified verdict</text>

  <rect x="315" y="238" width="770" height="55" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="700" y="261" class="body" text-anchor="middle">Durable history proves that an authorized attempt began.</text>
  <text x="700" y="282" class="body" text-anchor="middle">It does not prove whether append(entry) took effect.</text>

  <text x="35" y="328" class="small" font-weight="700">RECOVERY IS RELATIVE TO THE DECLARED EFFECT CONTRACT</text>
  <line x1="1190" y1="210" x2="1190" y2="338" class="branch"/>
  <line x1="275" y1="338" x2="1190" y2="338" class="branch"/>
  <path d="M275 338 V365" class="flow"/>
  <path d="M700 338 V365" class="flow"/>
  <path d="M1125 338 V365" class="flow"/>

  <rect x="65" y="370" width="420" height="205" class="card"/>
  <rect x="65" y="370" width="420" height="42" rx="6" fill="#e7f1f7"/>
  <path d="M65 406 H485" stroke="#526174" stroke-width="1.2"/>
  <text x="85" y="398" class="label">Deduplicated</text>
  <text x="85" y="443" class="body">Retry with the same stable key.</text>
  <text x="85" y="468" class="body">The service returns its memoized decision.</text>
  <text x="85" y="506" class="small">Sound basis: one durable decision per key</text>
  <text x="85" y="531" class="small">Result: one protected mutation, even if called again</text>
  <text x="85" y="556" class="small">Otherwise: Unknown</text>

  <rect x="490" y="370" width="420" height="205" class="card"/>
  <rect x="490" y="370" width="420" height="42" rx="6" fill="#ebf5ec"/>
  <path d="M490 406 H910" stroke="#526174" stroke-width="1.2"/>
  <text x="510" y="398" class="label">Idempotent</text>
  <text x="510" y="443" class="body">Retry only under the declared effect law.</text>
  <text x="510" y="468" class="body">Repeated calls refine one abstract effect.</text>
  <text x="510" y="506" class="small">Sound basis: adapter-specific idempotence</text>
  <text x="510" y="531" class="small">Result: retry within the capability budget</text>
  <text x="510" y="556" class="small">If evidence remains insufficient: Unknown</text>

  <rect x="915" y="370" width="420" height="205" class="card"/>
  <rect x="915" y="370" width="420" height="42" rx="6" fill="#f8eded"/>
  <path d="M915 406 H1335" stroke="#526174" stroke-width="1.2"/>
  <text x="935" y="398" class="label">Uncontrolled</text>
  <text x="935" y="443" class="body">Do not retry after the attempt was armed.</text>
  <text x="935" y="468" class="body">Neither Success nor Fail is justified.</text>
  <text x="935" y="506" class="small">Sound basis: preserve unresolved ambiguity</text>
  <text x="935" y="531" class="small">Result: durable terminal Unknown</text>
  <text x="935" y="556" class="small">Blind retry could duplicate the append</text>

  <text x="700" y="620" class="small" text-anchor="middle">The protocol does not promise physical exactly-once execution.</text>
</svg>
