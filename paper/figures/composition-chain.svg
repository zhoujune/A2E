<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">Composition from durable authorization to protected effects</title>
  <desc id="desc">Journal and typed-WAL refinements preserve broker history. Covered adapter and protected-service executions add effect refinement and complete mediation under explicit coverage and closed-interface premises.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3f7450"/>
    </marker>
    <style>
      .heading { font: 700 15px Arial, Helvetica, sans-serif; fill: #172033; }
      .label { font: 600 18px Arial, Helvetica, sans-serif; fill: #172033; }
      .body { font: 15px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #526174; }
      .node { fill: #ffffff; stroke: #526174; stroke-width: 1.5; rx: 5; }
      .refine { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .couple { fill: none; stroke: #3f7450; stroke-width: 2; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <text x="40" y="38" class="heading">HISTORY REFINEMENT</text>
  <line x1="40" y1="53" x2="900" y2="53" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="38" class="heading">PROTECTED-EFFECT COMPOSITION</text>
  <line x1="950" y1="53" x2="1460" y2="53" stroke="#b7cdbd" stroke-width="1"/>

  <rect x="40" y="105" width="245" height="120" class="node" fill="#f8fafc"/>
  <text x="162" y="145" class="label" text-anchor="middle">Broker model</text>
  <text x="162" y="174" class="body" text-anchor="middle">requests, authority,</text>
  <text x="162" y="198" class="body" text-anchor="middle">attempts, terminals</text>

  <rect x="345" y="105" width="245" height="120" class="node" fill="#f8fafc"/>
  <text x="467" y="145" class="label" text-anchor="middle">Atomic Journal</text>
  <text x="467" y="174" class="body" text-anchor="middle">append and replay</text>
  <text x="467" y="198" class="body" text-anchor="middle">abstract persistence</text>

  <rect x="650" y="105" width="245" height="120" class="node" fill="#f8fafc"/>
  <text x="772" y="145" class="label" text-anchor="middle">Typed WAL</text>
  <text x="772" y="174" class="body" text-anchor="middle">records, cuts,</text>
  <text x="772" y="198" class="body" text-anchor="middle">recovered prefixes</text>

  <rect x="955" y="105" width="220" height="120" class="node" fill="#f3f8f3"/>
  <text x="1065" y="145" class="label" text-anchor="middle">Adapter execution</text>
  <text x="1065" y="174" class="body" text-anchor="middle">attempts, results,</text>
  <text x="1065" y="198" class="body" text-anchor="middle">abstract effects</text>

  <rect x="1235" y="105" width="225" height="120" class="node" fill="#f3f8f3"/>
  <text x="1347" y="145" class="label" text-anchor="middle">Protected service</text>
  <text x="1347" y="174" class="body" text-anchor="middle">calls, decisions,</text>
  <text x="1347" y="198" class="body" text-anchor="middle">effect state</text>

  <path d="M345 165 H288" class="refine"/>
  <text x="316" y="82" class="small" text-anchor="middle">Journal-to-Broker</text>
  <text x="316" y="100" class="small" text-anchor="middle">trace refinement</text>

  <path d="M650 165 H593" class="refine"/>
  <text x="621" y="82" class="small" text-anchor="middle">typed persistence</text>
  <text x="621" y="100" class="small" text-anchor="middle">refines Journal</text>

  <path d="M895 165 H952" class="couple"/>
  <text x="923" y="82" class="small" text-anchor="middle">shared WAL</text>
  <text x="923" y="100" class="small" text-anchor="middle">event coupling</text>

  <path d="M1175 165 H1232" class="couple"/>
  <text x="1203" y="82" class="small" text-anchor="middle">exact call /</text>
  <text x="1203" y="100" class="small" text-anchor="middle">decision coupling</text>

  <rect x="800" y="255" width="300" height="70" rx="5" fill="#fff8ed" stroke="#8a6b35" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="950" y="282" class="body" text-anchor="middle" font-weight="700">Coverage premise</text>
  <text x="950" y="306" class="small" text-anchor="middle">each WAL terminal has a valid execution member</text>
  <path d="M950 255 V228" stroke="#8a6b35" stroke-width="1.3" stroke-dasharray="5 4"/>

  <rect x="1125" y="255" width="335" height="70" rx="5" fill="#fff8ed" stroke="#8a6b35" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="1292" y="282" class="body" text-anchor="middle" font-weight="700">Closed-interface premise</text>
  <text x="1292" y="306" class="small" text-anchor="middle">no out-of-band protected invocation</text>
  <path d="M1292 255 V228" stroke="#8a6b35" stroke-width="1.3" stroke-dasharray="5 4"/>

  <rect x="40" y="365" width="855" height="145" rx="7" fill="#eef4f8" stroke="#526174" stroke-width="1.5"/>
  <text x="65" y="397" class="heading">FOR EVERY ADMITTED FINITE SERIALIZED FAIL-STOP HISTORY</text>
  <text x="65" y="430" class="body">- every physical invocation has durable authorization ancestry</text>
  <text x="65" y="457" class="body">- accepted deliveries have exact request, attempt, and value provenance</text>
  <text x="65" y="484" class="body">- each logical request has at most one durable terminal; recovery preserves committed history</text>

  <rect x="925" y="365" width="535" height="145" rx="7" fill="#edf6ef" stroke="#3f7450" stroke-width="1.5"/>
  <text x="950" y="397" class="heading">FOR EACH COVERED TERMINAL UNDER THE PREMISES ABOVE</text>
  <text x="950" y="430" class="body">- every protected effect is mediated</text>
  <text x="950" y="457" class="body">- prefix effect states agree across coupled executions</text>
  <text x="950" y="484" class="body">- terminal outcomes refine the declared abstract effect</text>

  <path d="M467 225 V348" class="refine"/>
  <path d="M1192 325 V348" class="couple"/>

  <rect x="40" y="548" width="1420" height="45" rx="4" fill="#fafafa" stroke="#94a3b8" stroke-width="1"/>
  <text x="60" y="576" class="small">Boundary: protected/contextual instances are complete for Idempotent and Deduplicated; ReadOnly stops at adapter/WAL/Broker refinement; unresolved Uncontrolled effects are not retried and become Unknown.</text>
</svg>
